<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AccessAble</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="popup-header">
        <div class="header-row">
          <h1>AccessAble</h1>
          <div class="backend-indicator" aria-label="Backend connected">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="indicator-text">Backend Connected</span>
          </div>
        </div>
        <p class="tagline">Intelligent accessibility controls for every page</p>
      </header>

      <section class="stats-grid" aria-label="Accessibility metrics">
        <article class="stat-card">
          <p class="stat-value" id="imagesFixedStat">0</p>
          <p class="stat-label">Images Fixed</p>
        </article>
        <article
          class="stat-card"
          title="Count of keyboard accessibility fixes on this tab (skip link, focus styles, landmarks, etc.). Resets when you open a different website."
        >
          <p class="stat-value" id="elementsAdjustedStat">0</p>
          <p class="stat-label">Elements Adjusted</p>
          <p class="stat-hint">This page</p>
        </article>
      </section>

      <main class="popup-main" aria-label="Module controls">
        <section class="module-card">
          <button id="toggleReader" class="btn-primary toggle-control" type="button">
            <span class="module-copy">
              <span class="module-title"><span class="module-icon" aria-hidden="true">🔊</span> Screen Reader</span>
              <span id="readerStatus" class="module-status">Start Reading</span>
            </span>
            <span class="toggle-switch" aria-hidden="true">
              <span class="toggle-knob"></span>
            </span>
          </button>
          <button id="pauseResume" class="btn-secondary inline-action" style="display: none">
            <span id="pauseStatus">Pause</span>
          </button>
        </section>

        <section class="module-card">
          <button id="toggleImageMode" class="btn-primary toggle-control" type="button">
            <span class="module-copy">
              <span class="module-title"><span class="module-icon" aria-hidden="true">🖼️</span> AI Image Descriptions</span>
              <span id="imageModeStatus" class="module-status">Enable Image Mode</span>
            </span>
            <span class="toggle-switch" aria-hidden="true">
              <span class="toggle-knob"></span>
            </span>
          </button>
        </section>

        <section class="module-card">
          <button id="toggleKeyboardMode" class="btn-primary toggle-control" type="button">
            <span class="module-copy">
              <span class="module-title"><span class="module-icon" aria-hidden="true">⌨️</span> Keyboard Assist</span>
              <span id="keyboardModeStatus" class="module-status">Enable Keyboard Assist</span>
            </span>
            <span class="toggle-switch" aria-hidden="true">
              <span class="toggle-knob"></span>
            </span>
          </button>
        </section>

        <section class="module-card">
          <button id="toggleVoiceMode" class="btn-primary toggle-control" type="button">
            <span class="module-copy">
              <span class="module-title"><span class="module-icon" aria-hidden="true">🎤</span> Voice Commands</span>
              <span id="voiceModeStatus" class="module-status">Enable Voice Commands</span>
            </span>
            <span class="toggle-switch" aria-hidden="true">
              <span class="toggle-knob"></span>
            </span>
          </button>
        </section>

        <section class="module-card">
          <button id="toggleCaptionsMode" class="btn-primary toggle-control" type="button">
            <span class="module-copy">
              <span class="module-title"><span class="module-icon" aria-hidden="true">💬</span> Video Captions</span>
              <span id="captionsModeStatus" class="module-status">Enable Video Captions</span>
            </span>
            <span class="toggle-switch" aria-hidden="true">
              <span class="toggle-knob"></span>
            </span>
          </button>
        </section>

        <!--
          Caption Accessibility controls are intentionally hidden for internal defense.
          Module 2 engine code remains unchanged; only popup UI inputs are removed for now.
        -->
      </main>

      <input
        type="checkbox"
        id="settingsDrawerToggle"
        class="settings-drawer-toggle"
        hidden
      />
      <section class="settings-section" id="settingsPanel">
        <h2>Speech Settings</h2>

        <div class="setting-item">
          <label for="speed">Speech Speed</label>
          <div class="setting-control">
            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
            <span id="speedValue">1.0x</span>
          </div>
        </div>

        <div class="setting-item">
          <label for="pitch">Pitch</label>
          <div class="setting-control">
            <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1" />
            <span id="pitchValue">1.0x</span>
          </div>
        </div>

        <div class="setting-item">
          <label for="volume">Volume</label>
          <div class="setting-control">
            <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />
            <span id="volumeValue">100%</span>
          </div>
        </div>
      </section>

      <section class="shortcuts-section">
        <h2>Shortcuts</h2>
        <ul class="shortcuts-list">
          <li><kbd>Alt+R</kbd> Toggle reader</li>
          <li><kbd>Alt+S</kbd> Pause or resume</li>
          <li><kbd>Alt+N</kbd> Read next element</li>
          <li><kbd>Alt+P</kbd> Read previous element</li>
        </ul>
      </section>

      <footer class="action-footer">
        <div class="action-bar">
          <button id="scanCaptionsNow" class="btn-secondary action-button" type="button">
            <span id="captionsScanStatus">Check Captions Now</span>
          </button>
          <label for="settingsDrawerToggle" class="btn-secondary action-button settings-button">
            Settings
          </label>
        </div>
        <p class="status-text" id="statusText">Ready</p>
      </footer>
    </div>
    <script src="../shared/contracts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
